<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
  <title id="title">Library ER example in lecture notation</title>
  <desc id="desc">Study redraw of the lecture library example. Publisher to Book is one to many, with total Book participation. Author to Book is many to many, with total Book participation. Reader to Book is many to many, both partial. Only entity identifiers are displayed. Dates are relationship attributes.</desc>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #182a3a; font-size: 30px; text-anchor: middle; dominant-baseline: middle; }
    .title { font-size: 34px; font-weight: bold; }
    .note { font-size: 25px; }
    .shape { fill: white; stroke: #182a3a; stroke-width: 2; }
    .link { fill: none; stroke: #182a3a; stroke-width: 2; }
    .key { text-decoration: underline; }
  </style>
  <rect width="1400" height="850" fill="white"/>
  <text x="700" y="42" class="title">Library ER example</text>
  <text x="700" y="78" class="note">Entity identifiers only; other entity attributes are listed in the notes.</text>

  <!-- Reader and its key. -->
  <ellipse cx="700" cy="130" rx="92" ry="28" class="shape"/>
  <text x="700" y="130" class="key">readerID</text>
  <line x1="700" y1="158" x2="700" y2="190" class="link"/>
  <rect x="620" y="190" width="160" height="60" class="shape"/>
  <text x="700" y="220">Reader</text>

  <!-- BORROWS: partial participation on both sides. -->
  <line x1="700" y1="250" x2="700" y2="290" class="link"/>
  <polygon points="700,290 800,340 700,390 600,340" class="shape"/>
  <text x="700" y="340">BORROWS</text>
  <line x1="700" y1="390" x2="700" y2="490" class="link"/>
  <text x="724" y="270">M</text>
  <text x="724" y="465">N</text>
  <ellipse cx="440" cy="290" rx="82" ry="28" class="shape"/>
  <text x="440" y="290">startDate</text>
  <line x1="519" y1="300" x2="619" y2="330" class="link"/>
  <ellipse cx="960" cy="290" rx="82" ry="28" class="shape"/>
  <text x="960" y="290">endDate</text>
  <line x1="881" y1="300" x2="781" y2="330" class="link"/>

  <!-- Central Book and its key. -->
  <rect x="620" y="490" width="160" height="60" class="shape"/>
  <text x="700" y="520">Book</text>
  <line x1="700" y1="550" x2="700" y2="612" class="link"/>
  <ellipse cx="700" cy="640" rx="82" ry="28" class="shape"/>
  <text x="700" y="640" class="key">bookID</text>

  <!-- Publisher and key; PUBLISHES has total participation only for Book. -->
  <rect x="100" y="490" width="160" height="60" class="shape"/>
  <text x="180" y="520">Publisher</text>
  <ellipse cx="180" cy="400" rx="100" ry="28" class="shape"/>
  <text x="180" y="400" class="key">publisherID</text>
  <line x1="180" y1="428" x2="180" y2="490" class="link"/>
  <line x1="260" y1="520" x2="335" y2="520" class="link"/>
  <polygon points="440,465 545,520 440,575 335,520" class="shape"/>
  <text x="440" y="520" style="font-size:26px">PUBLISHES</text>
  <line x1="540" y1="517" x2="620" y2="517" class="link"/>
  <line x1="540" y1="523" x2="620" y2="523" class="link"/>
  <text x="295" y="493">1</text>
  <text x="585" y="493">N</text>
  <line x1="440" y1="575" x2="440" y2="612" class="link"/>
  <ellipse cx="440" cy="640" rx="95" ry="28" class="shape"/>
  <text x="440" y="640">publishDate</text>

  <!-- Author and key; WRITES has total participation only for Book. -->
  <rect x="1140" y="490" width="160" height="60" class="shape"/>
  <text x="1220" y="520">Author</text>
  <ellipse cx="1220" cy="400" rx="90" ry="28" class="shape"/>
  <text x="1220" y="400" class="key">authorID</text>
  <line x1="1220" y1="428" x2="1220" y2="490" class="link"/>
  <line x1="780" y1="517" x2="865" y2="517" class="link"/>
  <line x1="780" y1="523" x2="865" y2="523" class="link"/>
  <polygon points="960,465 1060,520 960,575 860,520" class="shape"/>
  <text x="960" y="520">WRITES</text>
  <line x1="1060" y1="520" x2="1140" y2="520" class="link"/>
  <text x="820" y="493">M</text>
  <text x="1100" y="493">N</text>

  <text x="700" y="740" class="note">Single line: partial participation. Double line: total participation.</text>
  <text x="700" y="775" class="note">Underlined attribute: key. 1 / M / N: Chen cardinality labels.</text>
  <text x="700" y="813" class="note">Adapted from Conceptual DB Design, slides 58–68. This is a study diagram.</text>
</svg>
